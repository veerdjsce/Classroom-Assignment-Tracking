services:
  - type: web
    name: classroom-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER_DATA_DIR
        value: /data/uploads
    disk:
      name: classroom-data
      mountPath: /data
      sizeGB: 1
